<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Frequency - FitGauge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface-hover:#1a1a1a;--border:#262626;--text:#f5f5f5;--text-secondary:#737373;--accent:#22c55e;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
header{padding:20px 0;border-bottom:1px solid var(--border)}
header .container{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:600;color:var(--text);text-decoration:none}
.logo svg{width:26px;height:26px;color:var(--accent)}
nav{display:flex;gap:28px}
nav a{color:var(--text-secondary);font-size:0.85rem;text-decoration:none}
main{padding:48px 0}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.85rem;text-decoration:none;margin-bottom:32px}
.page-header{margin-bottom:40px}
.page-title{font-size:1.75rem;font-weight:600;margin-bottom:8px}
.page-desc{color:var(--text-secondary);font-size:0.9rem}
.calculator{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.input-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
.input-group{margin-bottom:20px}
.input-label{font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px}
.input-field{width:100%;padding:14px;background:var(--surface-hover);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:1.1rem;text-align:center;font-weight:600}
.input-field:focus{outline:none;border-color:var(--accent)}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.option-btn{padding:14px;background:var(--surface-hover);border:2px solid var(--border);border-radius:10px;color:var(--text-secondary);font-size:0.85rem;cursor:pointer;text-align:center}
.option-btn.active{border-color:var(--accent);color:var(--accent)}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.result-header{padding:20px 24px;border-bottom:1px solid var(--border)}
.result-badge{padding:6px 12px;background:rgba(34,197,94,0.15);border-radius:20px;font-size:0.75rem;color:var(--accent)}
.result-body{padding:48px 24px;text-align:center}
.meals{font-size:3.5rem;font-weight:600;color:var(--accent)}
.meals-label{font-size:1rem;color:var(--text-secondary);margin-top:8px}
.schedule{margin-top:32px;padding-top:24px;border-top:1px solid var(--border)}
.schedule-title{font-size:0.85rem;color:var(--text-secondary);margin-bottom:16px}
.schedule-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:0.9rem}
.schedule-item:last-child{border:none}
.schedule-time{color:var(--text-secondary)}
.schedule-food{font-weight:500}
footer{padding:32px 0;border-top:1px solid var(--border);text-align:center;color:var(--text-secondary);font-size:0.8rem;margin-top:48px}
@media(max-width:768px){.calculator{grid-template-columns:1fr}nav{display:none}}
</style>
</head>
<body>
<header>
<div class="container">
<a href="../index.html" class="logo"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="6" fill="currentColor"/></svg>FitGauge</a>
<nav><a href="../profile.html">Profile</a><a href="../index.html#nutrition">Nutrition</a></nav>
</div>
</header>
<main class="container">
<a href="../index.html" class="back-link">← Back</a>
<div class="page-header">
<h1 class="page-title">Meal Frequency</h1>
<p class="page-desc">How often should you eat?</p>
</div>
<div class="calculator">
<div class="input-card">
<div class="input-group">
<div class="input-label">Goal</div>
<div class="options">
<div class="option-btn" data-goal="lose" onclick="setGoal(this)">Lose Fat</div>
<div class="option-btn active" data-goal="maintain" onclick="setGoal(this)">Maintain</div>
<div class="option-btn" data-goal="gain" onclick="setGoal(this)">Gain</div>
</div>
</div>
<div class="input-group">
<div class="input-label">Daily Schedule</div>
<div class="options">
<div class="option-btn" data-schedule="2" onclick="setSchedule(this)">2 meals</div>
<div class="option-btn active" data-schedule="3" onclick="setSchedule(this)">3 meals</div>
<div class="option-btn" data-schedule="5" onclick="setSchedule(this)">5 meals</div>
</div>
</div>
</div>
<div class="result-card">
<div class="result-header"><span class="result-badge">Schedule</span></div>
<div class="result-body">
<div class="meals" id="meals">3</div>
<div class="meals-label">meals per day</div>
<div class="schedule" id="schedule">
<div class="schedule-title">Sample Day</div>
<div class="schedule-item"><span class="schedule-time">8:00 AM</span><span class="schedule-food">Breakfast</span></div>
<div class="schedule-item"><span class="schedule-time">1:00 PM</span><span class="schedule-food">Lunch</span></div>
<div class="schedule-item"><span class="schedule-time">7:00 PM</span><span class="schedule-food">Dinner</span></div>
</div>
</div>
</div>
</div>
</div>
</main>
<footer>FitGauge</footer>
<script>
var goal='maintain';
var count=3;
function setGoal(el){document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');goal=el.dataset.goal;updateSchedule();}
function setSchedule(el){document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');count=parseInt(el.dataset.schedule);updateSchedule();}
function updateSchedule(){document.getElementById('meals').textContent=count;var s=document.getElementById('schedule');var times=['7:00 AM - 8:00 AM','12:00 PM - 1:00 PM','6:00 PM - 7:00 PM','10:00 AM, 2:00 PM, 6:00 PM'];var html='<div class="schedule-title">Sample Day</div>';if(count===2){html+='<div class="schedule-item"><span class="schedule-time">9:00 AM</span><span class="schedule-food">Meal 1</span></div>';html+='<div class="schedule-item"><span class="schedule-time">7:00 PM</span><span class="schedule-food">Meal 2</span></div>';}
else if(count===3){html+='<div class="schedule-item"><span class="schedule-time">8:00 AM</span><span class="schedule-food">Breakfast</span></div>';html+='<div class="schedule-item"><span class="schedule-time">1:00 PM</span><span class="schedule-food">Lunch</span></div>';html+='<div class="schedule-item"><span class="schedule-time">7:00 PM</span><span class="schedule-food">Dinner</span></div>';}
else{html+='<div class="schedule-item"><span class="schedule-time">8:00 AM</span><span class="schedule-food">Breakfast + Snack</span></div>';html+='<div class="schedule-item"><span class="schedule-time">1:00 PM</span><span class="schedule-food">Lunch</span></div>';html+='<div class="schedule-item"><span class="schedule-time">4:00 PM</span><span class="schedule-food">Snack</span></div>';html+='<div class="schedule-item"><span class="schedule-time">7:00 PM</span><span class="schedule-food">Dinner</span></div>';}
s.innerHTML=html;}
updateSchedule();
</script>
</body>
</html>
