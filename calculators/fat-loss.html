<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fat Loss - FitGauge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface-hover:#1a1a1a;--border:#262626;--text:#f5f5f5;--text-secondary:#737373;--accent:#22c55e;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
header{padding:20px 0;border-bottom:1px solid var(--border)}
header .container{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:600;color:var(--text);text-decoration:none}
.logo svg{width:26px;height:26px;color:var(--accent)}
nav{display:flex;gap:28px}
nav a{color:var(--text-secondary);font-size:0.85rem;text-decoration:none}
main{padding:48px 0}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.85rem;text-decoration:none;margin-bottom:32px}
.page-header{margin-bottom:40px}
.page-title{font-size:1.75rem;font-weight:600;margin-bottom:8px}
.page-desc{color:var(--text-secondary);font-size:0.9rem}
.calculator{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.input-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
.input-group{margin-bottom:20px}
.input-label{font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px}
.input-field{width:100%;padding:14px;background:var(--surface-hover);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:1.1rem;text-align:center;font-weight:600}
.input-field:focus{outline:none;border-color:var(--accent)}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.result-header{padding:20px 24px;border-bottom:1px solid var(--border)}
.result-badge{padding:6px 12px;background:rgba(34,197,94,0.15);border-radius:20px;font-size:0.75rem;color:var(--accent)}
.result-body{padding:48px 24px;text-align:center}
.result-value{font-size:4rem;font-weight:600;color:var(--accent)}
.result-unit{font-size:1.1rem;color:var(--text-secondary);margin-top:4px}
.msg{font-size:1rem;color:var(--text-secondary);margin-top:16px;line-height:1.6}
.tips{margin-top:32px;padding-top:24px;border-top:1px solid var(--border);text-align:left}
.tips-title{font-size:0.75rem;color:var(--text-secondary);text-transform:uppercase;margin-bottom:12px}
.tip{font-size:0.9rem;color:var(--text-secondary);padding:8px 0}
footer{padding:32px 0;border-top:1px solid var(--border);text-align:center;color:var(--text-secondary);font-size:0.8rem;margin-top:48px}
@media(max-width:768px){.calculator{grid-template-columns:1fr}nav{display:none}}
</style>
</head>
<body>
<header>
<div class="container">
<a href="../index.html" class="logo"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="6" fill="currentColor"/></svg>FitGauge</a>
<nav><a href="../profile.html">Profile</a><a href="../index.html#goals">Goals</a></nav>
</div>
</header>
<main class="container">
<a href="../index.html" class="back-link">← Back</a>
<div class="page-header">
<h1 class="page-title">Fat Loss</h1>
<p class="page-desc">Lose fat the healthy way</p>
</div>
<div class="calculator">
<div class="input-card">
<div class="input-group">
<div class="input-label">Your Weight (kg)</div>
<input type="number" class="input-field" id="weight" placeholder="Enter weight" oninput="calc()">
</div>
<div class="input-group">
<div class="input-label">Goal (kg)</div>
<input type="number" class="input-field" id="goal" placeholder="Enter goal" oninput="calc()">
</div>
</div>
<div class="result-card">
<div class="result-header"><span class="result-badge">Plan</span></div>
<div class="result-body">
<div class="result-value" id="weeks">-</div>
<div class="result-unit">weeks to reach goal</div>
<div class="msg" id="msg">Enter your weight and goal above</div>
<div class="tips">
<div class="tips-title">How to lose fat</div>
<div class="tip">🥗 Eat more protein and veggies</div>
<div class="tip">🚶 Walk 30 mins daily</div>
<div class="tip">🚫 Avoid sugar and processed food</div>
<div class="tip">💧 Drink 2-3L water daily</div>
</div>
</div>
</div>
</div>
</div>
</main>
<footer>FitGauge</footer>
<script>
function calc(){
var w=parseFloat(document.getElementById('weight').value);
var g=parseFloat(document.getElementById('goal').value);
if(isNaN(w)||isNaN(g)){
document.getElementById('weeks').textContent='-';
document.getElementById('msg').textContent='Enter your weight and goal above';
return;
}
var diff=w-g;
if(diff<=0){
document.getElementById('weeks').textContent='-';
document.getElementById('msg').textContent='Goal must be lower than current weight';
return;
}
var weeks=Math.ceil(diff/0.5);
document.getElementById('weeks').textContent=weeks;
document.getElementById('msg').textContent='Lose '+diff+' kg at 0.5 kg/week';
}
window.onload=function(){
var storedWeight=localStorage.getItem('fitgauge_weight');
if(storedWeight){
var w=parseFloat(storedWeight);
var wU=localStorage.getItem('fitgauge_weight_unit')||'kg';
if(wU==='lbs')w=Math.round(w*0.453592);
document.getElementById('weight').value=w;
calc();
}
};
</script>
>
</body>
</html>
