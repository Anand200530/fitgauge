<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Age - FitGauge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface-hover:#1a1a1a;--border:#262626;--text:#f5f5f5;--text-secondary:#737373;--accent:#22c55e;--green:#4ade80;--blue:#60a5fa;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
header{padding:20px 0;border-bottom:1px solid var(--border)}
header .container{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:600;color:var(--text);text-decoration:none}
.logo svg{width:26px;height:26px;color:var(--accent)}
nav{display:flex;gap:28px}
nav a{color:var(--text-secondary);font-size:0.85rem;text-decoration:none}
main{padding:48px 0}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.85rem;text-decoration:none;margin-bottom:32px}
.page-header{margin-bottom:40px}
.page-title{font-size:1.75rem;font-weight:600;margin-bottom:8px}
.page-desc{color:var(--text-secondary);font-size:0.9rem}
.calculator{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.input-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
.input-group{margin-bottom:20px}
.input-label{font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px}
.input-field{width:100%;padding:14px;background:var(--surface-hover);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:1.1rem;text-align:center;font-weight:600}
.input-field:focus{outline:none;border-color:var(--accent)}
.activity-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.activity-btn{padding:14px;background:var(--surface-hover);border:2px solid var(--border);border-radius:10px;color:var(--text-secondary);font-size:0.85rem;cursor:pointer;text-align:center}
.activity-btn.active{border-color:var(--green);color:var(--green)}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.result-header{padding:20px 24px;border-bottom:1px solid var(--border)}
.result-badge{padding:6px 12px;background:rgba(74,222,128,0.15);border-radius:20px;font-size:0.75rem;color:var(--green)}
.result-body{padding:48px 24px;text-align:center}
.age-visual{position:relative;width:140px;height:140px;margin:0 auto 24px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--blue));display:flex;align-items:center;justify-content:center}
.age-inner{width:110px;height:110px;background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column}
.age-value{font-size:2.5rem;font-weight:600;color:var(--text)}
.age-label{font-size:0.75rem;color:var(--text-secondary)}
.comparison{font-size:1rem;color:var(--text-secondary);margin-top:16px}
.comparison span{color:var(--green);font-weight:600}
footer{padding:32px 0;border-top:1px solid var(--border);text-align:center;color:var(--text-secondary);font-size:0.8rem;margin-top:48px}
@media(max-width:768px){.calculator{grid-template-columns:1fr}nav{display:none}}
</style>
</head>
<body>
<header>
<div class="container">
<a href="../index.html" class="logo"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="6" fill="currentColor"/></svg>FitGauge</a>
<nav><a href="../profile.html">Profile</a><a href="../index.html#fitness">Fitness</a></nav>
</div>
</header>
<main class="container">
<a href="../index.html" class="back-link">← Back</a>
<div class="page-header">
<h1 class="page-title">Fitness Age</h1>
<p class="page-desc">How fit are you?</p>
</div>
<div class="calculator">
<div class="input-card">
<div class="input-group">
<div class="input-label">Your Age</div>
<input type="number" class="input-field" id="age" value="30" oninput="calc()">
</div>
<div class="input-group">
<div class="input-label">Resting Heart Rate (bpm)</div>
<input type="number" class="input-field" id="hr" value="70" oninput="calc()">
</div>
<div class="input-group">
<div class="input-label">Weekly Activity</div>
<div class="activity-options">
<div class="activity-btn" data-factor="1.2" onclick="setActivity(this)">None</div>
<div class="activity-btn" data-factor="0.9" onclick="setActivity(this)">1-2 days</div>
<div class="activity-btn active" data-factor="0.7" onclick="setActivity(this)">3-4 days</div>
<div class="activity-btn" data-factor="0.5" onclick="setActivity(this)">5+ days</div>
</div>
</div>
</div>
<div class="result-card">
<div class="result-header"><span class="result-badge">❤️ Fitness Age</span></div>
<div class="result-body">
<div class="age-visual"><div class="age-inner"><div class="age-value" id="fitness-age">28</div><div class="age-label">years</div></div></div>
<div class="comparison" id="comparison">You look younger!</div>
</div>
</div>
</div>
</div>
</main>
<footer>FitGauge</footer>
<script>
var factor=0.7;
function setActivity(el){document.querySelectorAll('.activity-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');factor=parseFloat(el.dataset.factor);calc();}
function calc(){var age=parseInt(document.getElementById('age').value)||30;var hr=parseInt(document.getElementById('hr').value)||70;var base=220-hr;var fitAge=Math.round(age*factor+base*0.3*factor);fitAge=Math.max(15,Math.min(80,fitAge));document.getElementById('fitness-age').textContent=fitAge;var diff=age-fitAge;var el=document.getElementById('comparison');if(diff>0){el.innerHTML='You look <span>'+diff+' years</span> younger!';el.style.color='var(--green)'}else if(diff<0){el.innerHTML='You look <span>'+(-diff)+' years</span> older';el.style.color='#f87171'}else{el.textContent='Right on track!';el.style.color='var(--text-secondary)'}}
calc();
</script>
</body>
</html>
