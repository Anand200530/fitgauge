<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMR Calculator - FitGauge</title>
    <link rel="stylesheet" href="../../styles.css">
    <style>
        :root {
            --fire-orange: #ff6b35;
            --fire-red: #dc3545;
            --fire-yellow: #ffc107;
            --fire-dark: #1a0a0a;
            --flame-gradient: linear-gradient(135deg, #ff6b35 0%, #dc3545 50%, #8b0000 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, var(--fire-dark) 0%, #2d1515 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: var(--flame-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 107, 53, 0.3);
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .calculator-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 107, 53, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #ddd;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(255, 107, 53, 0.3);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--fire-orange);
            box-shadow: 0 0 15px rgba(255, 107, 53, 0.3);
        }

        .toggle-wrapper {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid rgba(255, 107, 53, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .toggle-btn.active {
            background: var(--flame-gradient);
            border-color: var(--fire-orange);
            color: #fff;
        }

        .toggle-btn:hover:not(.active) {
            border-color: var(--fire-orange);
            color: #fff;
        }

        .gender-toggle {
            display: flex;
            gap: 10px;
        }

        .gender-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid rgba(255, 107, 53, 0.3);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .gender-btn.active {
            background: var(--flame-gradient);
            border-color: var(--fire-orange);
            color: #fff;
        }

        .gender-btn:hover:not(.active) {
            border-color: var(--fire-orange);
            color: #fff;
        }

        .formula-select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(255, 107, 53, 0.3);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .formula-select:focus {
            outline: none;
            border-color: var(--fire-orange);
        }

        .formula-select option {
            background: #1a0a0a;
            color: #fff;
        }

        .calculate-btn {
            width: 100%;
            padding: 16px;
            background: var(--flame-gradient);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }

        .result-section {
            margin-top: 30px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .result-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .flame-container {
            position: relative;
            width: 150px;
            height: 200px;
            margin: 0 auto 20px;
        }

        .flame {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 150px;
            background: var(--flame-gradient);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker 0.5s infinite alternate;
            filter: blur(5px);
        }

        .flame::before {
            content: '';
            position: absolute;
            bottom: 20%;
            left: 25%;
            width: 50%;
            height: 60%;
            background: linear-gradient(180deg, var(--fire-yellow) 0%, var(--fire-orange) 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker 0.3s infinite alternate;
        }

        .flame::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 40%;
            background: var(--fire-orange);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            filter: blur(10px);
        }

        @keyframes flicker {
            0% {
                transform: translateX(-50%) scale(1) rotate(-2deg);
                filter: blur(5px) brightness(1);
            }
            50% {
                transform: translateX(-50%) scale(1.05) rotate(1deg);
                filter: blur(4px) brightness(1.1);
            }
            100% {
                transform: translateX(-50%) scale(0.95) rotate(-1deg);
                filter: blur(6px) brightness(0.9);
            }
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            bottom: 50px;
            width: 4px;
            height: 4px;
            background: var(--fire-yellow);
            border-radius: 50%;
            animation: rise 2s infinite;
            opacity: 0;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(0);
                opacity: 0;
            }
        }

        .bmr-value {
            font-size: 3.5rem;
            font-weight: 700;
            background: var(--flame-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .bmr-label {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 15px;
        }

        .formula-info {
            background: rgba(255, 107, 53, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #ccc;
            text-align: left;
        }

        .formula-info strong {
            color: var(--fire-orange);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            .calculator-card {
                padding: 20px;
            }
            
            .bmr-value {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 BMR Calculator</h1>
        <p class="subtitle">Discover your body's daily caloric needs</p>
        
        <div class="calculator-card">
            <div class="form-group">
                <label>Formula</label>
                <select class="formula-select" id="formula">
                    <option value="mifflin">Mifflin-St Jeor (Recommended)</option>
                    <option value="harris">Harris-Benedict (Original)</option>
                    <option value="katch">Katch-McArdle (With Body Fat)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="gender-toggle">
                    <button class="gender-btn active" data-gender="male">
                        <span>👨</span> Male
                    </button>
                    <button class="gender-btn" data-gender="female">
                        <span>👩</span> Female
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="age">Age (years)</label>
                <input type="number" id="age" placeholder="Enter your age" min="1" max="120">
            </div>

            <div class="form-group">
                <label>Height</label>
                <div class="toggle-wrapper">
                    <button class="toggle-btn active" data-height-unit="cm">cm</button>
                    <button class="toggle-btn" data-height-unit="ft">ft/in</button>
                </div>
                <div class="input-wrapper">
                    <input type="number" id="height" placeholder="Enter height">
                </div>
                <div id="ft-inputs" class="toggle-wrapper hidden">
                    <input type="number" id="height-ft" placeholder="Feet" min="1" max="8">
                    <input type="number" id="height-in" placeholder="Inches" min="0" max="11">
                </div>
            </div>

            <div class="form-group">
                <label>Weight</label>
                <div class="toggle-wrapper">
                    <button class="toggle-btn active" data-weight-unit="kg">kg</button>
                    <button class="toggle-btn" data-weight-unit="lbs">lbs</button>
                </div>
                <input type="number" id="weight" placeholder="Enter weight" min="1">
            </div>

            <div class="form-group hidden" id="bodyfat-group">
                <label for="bodyfat">Body Fat % (optional)</label>
                <input type="number" id="bodyfat" placeholder="Enter body fat percentage" min="3" max="60">
            </div>

            <button class="calculate-btn" id="calculate">🔥 Calculate BMR</button>

            <div class="result-section" id="result">
                <div class="flame-container">
                    <div class="flame"></div>
                    <div class="particles" id="particles"></div>
                </div>
                <div class="bmr-value" id="bmr-value">0</div>
                <div class="bmr-label">calories/day</div>
                <div class="formula-info" id="formula-info"></div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const genderBtns = document.querySelectorAll('.gender-btn');
        const heightToggles = document.querySelectorAll('[data-height-unit]');
        const weightToggles = document.querySelectorAll('[data-weight-unit]');
        const formulaSelect = document.getElementById('formula');
        const calculateBtn = document.getElementById('calculate');
        const resultSection = document.getElementById('result');
        const bmrValue = document.getElementById('bmr-value');
        const formulaInfo = document.getElementById('formula-info');
        const bodyFatGroup = document.getElementById('bodyfat-group');
        const ftInputs = document.getElementById('ft-inputs');
        const heightInput = document.getElementById('height');

        // State
        let gender = 'male';
        let heightUnit = 'cm';
        let weightUnit = 'kg';
        let formula = 'mifflin';

        // Event Listeners
        genderBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                genderBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gender = btn.dataset.gender;
            });
        });

        heightToggles.forEach(btn => {
            btn.addEventListener('click', () => {
                heightToggles.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                heightUnit = btn.dataset.heightUnit;
                
                if (heightUnit === 'ft') {
                    heightInput.classList.add('hidden');
                    ftInputs.classList.remove('hidden');
                } else {
                    heightInput.classList.remove('hidden');
                    ftInputs.classList.add('hidden');
                }
            });
        });

        weightToggles.forEach(btn => {
            btn.addEventListener('click', () => {
                weightToggles.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                weightUnit = btn.dataset.weightUnit;
            });
        });

        formulaSelect.addEventListener('change', (e) => {
            formula = e.target.value;
            if (formula === 'katch') {
                bodyFatGroup.classList.remove('hidden');
            } else {
                bodyFatGroup.classList.add('hidden');
            }
        });

        calculateBtn.addEventListener('click', calculateBMR);

        // Create particles
        function createParticles() {
            const container = document.getElementById('particles');
            container.innerHTML = '';
            
            for (let i = 0; i < 5; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = (30 + Math.random() * 40) + '%';
                particle.style.animationDelay = (Math.random() * 2) + 's';
                particle.style.animationDuration = (1.5 + Math.random()) + 's';
                container.appendChild(particle);
            }
        }

        // Calculate BMR
        function calculateBMR() {
            const age = parseFloat(document.getElementById('age').value);
            let height = parseFloat(document.getElementById('height').value);
            let weight = parseFloat(document.getElementById('weight').value);
            const bodyFat = parseFloat(document.getElementById('bodyfat').value);

            if (!age || !weight) {
                alert('Please fill in all required fields');
                return;
            }

            // Convert to standard units (cm, kg)
            if (heightUnit === 'ft') {
                const feet = parseFloat(document.getElementById('height-ft').value) || 0;
                const inches = parseFloat(document.getElementById('height-in').value) || 0;
                if (!feet && !inches) {
                    alert('Please enter your height');
                    return;
                }
                height = (feet * 30.48) + (inches * 2.54);
            }

            if (weightUnit === 'lbs') {
                weight = weight * 0.453592;
            }

            let bmr = 0;
            let formulaDescription = '';

            switch (formula) {
                case 'mifflin':
                    if (gender === 'male') {
                        bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
                    } else {
                        bmr = (10 * weight) + (6.25 * height) - (5 * age) - 161;
                    }
                    formulaDescription = `<strong>Mifflin-St Jeor:</strong> Most accurate for modern populations. Developed in 1990, widely used by dietitians.`;
                    break;

                case 'harris':
                    if (gender === 'male') {
                        bmr = 66.47 + (13.75 * weight) + (5.003 * height) - (6.755 * age);
                    } else {
                        bmr = 655.1 + (9.563 * weight) + (1.850 * height) - (4.676 * age);
                    }
                    formulaDescription = `<strong>Harris-Benedict:</strong> Original formula (1919), tends to overestimate caloric needs. Good for general reference.`;
                    break;

                case 'katch':
                    if (!bodyFat) {
                        alert('Please enter your body fat percentage for Katch-McArdle formula');
                        return;
                    }
                    const leanMass = weight * (1 - (bodyFat / 100));
                    bmr = 370 + (21.6 * leanMass);
                    formulaDescription = `<strong>Katch-McArdle:</strong> Most accurate as it uses lean body mass. Ideal for athletes and those who know their body fat %.`;
                    break;
            }

            bmr = Math.round(bmr);
            bmrValue.textContent = bmr.toLocaleString();
            formulaInfo.innerHTML = formulaDescription;

            resultSection.classList.add('visible');
            createParticles();

            // Animate the number
            animateValue(bmrValue, 0, bmr, 1000);
        }

        // Animate number counting
        function animateValue(element, start, end, duration) {
            const startTimestamp = performance.now();
            
            function step(timestamp) {
                const elapsed = timestamp - startTimestamp;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                const current = Math.floor(easeProgress * (end - start) + start);
                element.textContent = current.toLocaleString();
                
                if (progress < 1) {
                    requestAnimationFrame(step);
                }
            }
            
            requestAnimationFrame(step);
        }
    </script>
</body>
</html>
