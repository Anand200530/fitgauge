<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weight Loss Timeline - FitGauge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface-hover:#1a1a1a;--border:#262626;--text:#f5f5f5;--text-secondary:#737373;--accent:#22c55e;--green:#4ade80;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
header{padding:20px 0;border-bottom:1px solid var(--border)}
header .container{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:600;color:var(--text);text-decoration:none}
.logo svg{width:26px;height:26px;color:var(--accent)}
nav{display:flex;gap:28px}
nav a{color:var(--text-secondary);font-size:0.85rem;text-decoration:none}
main{padding:48px 0}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.85rem;text-decoration:none;margin-bottom:32px}
.page-header{margin-bottom:40px}
.page-title{font-size:1.75rem;font-weight:600;margin-bottom:8px}
.page-desc{color:var(--text-secondary);font-size:0.9rem}
.calculator{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.input-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
.input-group{margin-bottom:20px}
.input-label{font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px}
.input-field{width:100%;padding:14px;background:var(--surface-hover);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:1.1rem;text-align:center;font-weight:600}
.input-field:focus{outline:none;border-color:var(--accent)}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.option-btn{padding:14px;background:var(--surface-hover);border:2px solid var(--border);border-radius:10px;color:var(--text-secondary);font-size:0.85rem;cursor:pointer;text-align:center}
.option-btn.active{border-color:var(--accent);color:var(--accent)}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.result-header{padding:20px 24px;border-bottom:1px solid var(--border)}
.result-badge{padding:6px 12px;background:rgba(34,197,94,0.15);border-radius:20px;font-size:0.75rem;color:var(--accent)}
.result-body{padding:48px 24px;text-align:center}
.result-value{font-size:4rem;font-weight:600;color:var(--accent)}
.result-unit{font-size:1rem;color:var(--text-secondary);margin-top:4px}
.breakdown{margin-top:32px;padding-top:24px;border-top:1px solid var(--border);text-align:left}
.breakdown-title{font-size:0.85rem;color:var(--text-secondary);margin-bottom:16px}
.breakdown-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:0.9rem}
.breakdown-item:last-child{border:none}
.breakdown-label{color:var(--text-secondary)}
.breakdown-value{font-weight:600}
footer{padding:32px 0;border-top:1px solid var(--border);text-align:center;color:var(--text-secondary);font-size:0.8rem;margin-top:48px}
@media(max-width:768px){.calculator{grid-template-columns:1fr}nav{display:none}}
</style>
</head>
<body>
<header>
<div class="container">
<a href="../index.html" class="logo"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="6" fill="currentColor"/></svg>FitGauge</a>
<nav><a href="../profile.html">Profile</a><a href="../index.html#goals">Goals</a></nav>
</div>
</header>
<main class="container">
<a href="../index.html" class="back-link">← Back</a>
<div class="page-header">
<h1 class="page-title">Weight Loss Timeline</h1>
<p class="page-desc">How long to reach your goal?</p>
</div>
<div class="calculator">
<div class="input-card">
<div class="input-group">
<div class="input-label">Current Weight (kg)</div>
<input type="number" class="input-field" id="current" value="80" oninput="calc()">
</div>
<div class="input-group">
<div class="input-label">Goal Weight (kg)</div>
<input type="number" class="input-field" id="goal" value="70" oninput="calc()">
</div>
<div class="input-group">
<div class="input-label">How fast?</div>
<div class="options">
<div class="option-btn" data-rate="0.25" onclick="setRate(this)">Slow</div>
<div class="option-btn active" data-rate="0.5" onclick="setRate(this)">Normal</div>
<div class="option-btn" data-rate="1" onclick="setRate(this)">Fast</div>
</div>
</div>
</div>
<div class="result-card">
<div class="result-header"><span class="result-badge">Timeline</span></div>
<div class="result-body">
<div class="result-value" id="weeks">20</div>
<div class="result-unit">weeks to goal</div>
<div class="breakdown" id="breakdown">
<div class="breakdown-title">Monthly Progress</div>
<div class="breakdown-item"><span class="breakdown-label">Month 1</span><span class="breakdown-value">78 kg</span></div>
<div class="breakdown-item"><span class="breakdown-label">Month 2</span><span class="breakdown-value">76 kg</span></div>
<div class="breakdown-item"><span class="breakdown-label">Month 3</span><span class="breakdown-value">74 kg</span></div>
<div class="breakdown-item"><span class="breakdown-label">Month 4</span><span class="breakdown-value">72 kg</span></div>
<div class="breakdown-item"><span class="breakdown-label">Month 5</span><span class="breakdown-value">70 kg</span></div>
</div>
</div>
</div>
</div>
</div>
</main>
<footer>FitGauge</footer>
<script>
var rate=0.5;
function setRate(el){document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');rate=parseFloat(el.dataset.rate);calc();}
function calc(){var current=parseFloat(document.getElementById('current').value)||80;var goal=parseFloat(document.getElementById('goal').value)||70;var diff=current-goal;if(diff<=0){document.getElementById('weeks').textContent='-';return;}
var weeks=Math.ceil(diff/rate);document.getElementById('weeks').textContent=weeks;var months=Math.ceil(weeks/4);var html='<div class="breakdown-title">Monthly Progress</div>';for(var m=1;m<=months&&m<=12;m++){var w=Math.max(goal,current-(m*4*rate));html+='<div class="breakdown-item"><span class="breakdown-label">Month '+m+'</span><span class="breakdown-value">'+w.toFixed(1)+' kg</span></div>';}
document.getElementById('breakdown').innerHTML=html;}
calc();
</script>
</body>
</html>
