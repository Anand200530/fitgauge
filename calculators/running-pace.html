<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Running Pace - FitGauge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface-hover:#1a1a1a;--border:#262626;--text:#f5f5f5;--text-secondary:#737373;--accent:#22c55e;--orange:#f97316;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
header{padding:20px 0;border-bottom:1px solid var(--border)}
header .container{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:600;color:var(--text);text-decoration:none}
.logo svg{width:26px;height:26px;color:var(--accent)}
nav{display:flex;gap:28px}
nav a{color:var(--text-secondary);font-size:0.85rem;text-decoration:none}
main{padding:48px 0}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.85rem;text-decoration:none;margin-bottom:32px;transition:color 0.2s}
.back-link:hover{color:var(--text)}
.page-header{margin-bottom:40px}
.page-title{font-size:1.75rem;font-weight:600;margin-bottom:8px}
.page-desc{color:var(--text-secondary);font-size:0.9rem}
.calculator{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.input-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
.input-group{margin-bottom:20px}
.input-label{display:block;font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px}
.input-field{width:100%;padding:14px;background:var(--surface-hover);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:1.1rem;text-align:center;font-weight:600;transition:all 0.2s ease}
.input-field:focus{outline:none;border-color:var(--accent)}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.result-header{padding:20px 24px;border-bottom:1px solid var(--border)}
.result-badge{padding:6px 12px;background:rgba(249,115,22,0.15);border-radius:20px;font-size:0.75rem;color:var(--orange)}
.result-body{padding:48px 24px;text-align:center}
.pace-visual{position:relative;width:120px;height:120px;margin:0 auto 24px}
.pace-ring{transform:rotate(-90deg)}
.pace-bg{fill:none;stroke:var(--border);stroke-width:8}
.pace-fill{fill:none;stroke:var(--orange);stroke-width:8;stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:70;transition:stroke-dashoffset 0.3s ease}
.pace-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.5rem;font-weight:600;color:var(--text)}
.result-value{font-size:3rem;font-weight:600;color:var(--orange);transition:color 0.3s ease}
.result-unit{font-size:1rem;color:var(--text-secondary);margin-top:4px}
.split-list{margin-top:24px;text-align:left}
.split-title{font-size:0.75rem;color:var(--text-secondary);text-transform:uppercase;margin-bottom:12px}
.split-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:0.9rem;transition:all 0.2s ease}
.split-item:last-child{border:none}
.split-item:hover{padding-left:8px}
.split-label{color:var(--text-secondary)}
.split-value{font-weight:600}
footer{padding:32px 0;border-top:1px solid var(--border);text-align:center;color:var(--text-secondary);font-size:0.8rem;margin-top:48px}
@media(max-width:768px){.calculator{grid-template-columns:1fr}nav{display:none}}
</style>
</head>
<body>
<header>
<div class="container">
<a href="index.html" class="logo"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="6" fill="currentColor"/></svg>FitGauge</a>
<nav><a href="profile.html">Profile</a><a href="index.html#fitness">Fitness</a></nav>
</div>
</header>
<main class="container">
<a href="index.html" class="back-link">← Back</a>
<div class="page-header">
<h1 class="page-title">Running Pace</h1>
<p class="page-desc">Calculate your pace</p>
</div>
<div class="calculator">
<div class="input-card">
<div class="input-group">
<div class="input-label">Distance (km)</div>
<input type="number" class="input-field" id="distance" value="5" oninput="calc()">
</div>
<div class="input-group">
<div class="input-label">Time (minutes)</div>
<input type="number" class="input-field" id="minutes" value="30" oninput="calc()">
</div>
</div>
<div class="result-card">
<div class="result-header"><span class="result-badge">🏃 Pace</span></div>
<div class="result-body">
<div class="pace-visual">
<svg class="pace-ring" width="120" height="120" viewBox="0 0 120 120">
<circle class="pace-bg" cx="60" cy="60" r="45"/>
<circle class="pace-fill" id="pace-ring" cx="60" cy="60" r="45"/>
</svg>
<div class="pace-text" id="pace-text">6:00</div>
</div>
<div class="result-value" id="avg-pace">6:00</div>
<div class="result-unit">min/km</div>
<div class="split-list">
<div class="split-title">Splits</div>
<div class="split-item"><span class="split-label">1 km</span><span class="split-value" id="split1">6:00</span></div>
<div class="split-item"><span class="split-label">5 km</span><span class="split-value" id="split5">30:00</span></div>
<div class="split-item"><span class="split-label">10 km</span><span class="split-value" id="split10">60:00</span></div>
<div class="split-item"><span class="split-label">Half Marathon</span><span class="split-value" id="split21">126:00</span></div>
</div>
</div>
</div>
</div>
</div>
</main>
<footer>FitGauge</footer>
<script>
function formatTime(min){var m=Math.floor(min);var s=Math.round((min-m)*60);if(s<10)s='0'+s;return m+':'+s;}
function calc(){var d=parseFloat(document.getElementById('distance').value)||5;var t=parseFloat(document.getElementById('minutes').value)||30;var pace=t/d;document.getElementById('pace-text').textContent=formatTime(pace);document.getElementById('avg-pace').textContent=formatTime(pace);document.getElementById('split1').textContent=formatTime(pace);document.getElementById('split5').textContent=formatTime(pace*5);document.getElementById('split10').textContent=formatTime(pace*10);document.getElementById('split21').textContent=formatTime(pace*21.1);}
calc();
</script>
</body>
</html>
