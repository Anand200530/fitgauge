<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1RM Calculator - FitGauge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface-hover:#1a1a1a;--border:#262626;--text:#f5f5f5;--text-secondary:#737373;--accent:#22c55e;--orange:#f97316;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
header{padding:20px 0;border-bottom:1px solid var(--border)}
header .container{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:600;color:var(--text);text-decoration:none}
.logo svg{width:26px;height:26px;color:var(--accent)}
nav{display:flex;gap:28px}
nav a{color:var(--text-secondary);font-size:0.85rem;text-decoration:none}
main{padding:48px 0}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.85rem;text-decoration:none;margin-bottom:32px}
.page-header{margin-bottom:40px}
.page-title{font-size:1.75rem;font-weight:600;margin-bottom:8px}
.page-desc{color:var(--text-secondary);font-size:0.9rem}
.calculator{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.input-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
.input-group{margin-bottom:20px}
.input-label{font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px}
.input-field{width:100%;padding:14px;background:var(--surface-hover);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:1.1rem;text-align:center;font-weight:600}
.input-field:focus{outline:none;border-color:var(--accent)}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.result-header{padding:20px 24px;border-bottom:1px solid var(--border)}
.result-badge{padding:6px 12px;background:rgba(249,115,22,0.15);border-radius:20px;font-size:0.75rem;color:var(--orange)}
.result-body{padding:32px 24px}
.max-display{text-align:center;margin-bottom:24px}
.max-value{font-size:4rem;font-weight:600;color:var(--orange)}
.max-label{font-size:0.9rem;color:var(--text-secondary)}
.chart{display:flex;gap:8px;margin-bottom:24px}
.chart-bar{flex:1;display:flex;flex-direction:column;align-items:center;padding:12px 8px;background:var(--surface-hover);border-radius:8px}
.chart-fill{width:8px;height:60px;background:var(--orange);border-radius:4px;margin-bottom:8px}
.chart-pct{font-size:0.85rem;font-weight:600;color:var(--text)}
.chart-kg{font-size:0.7rem;color:var(--text-secondary)}
footer{padding:32px 0;border-top:1px solid var(--border);text-align:center;color:var(--text-secondary);font-size:0.8rem;margin-top:48px}
@media(max-width:768px){.calculator{grid-template-columns:1fr}nav{display:none}}
</style>
</head>
<body>
<header>
<div class="container">
<a href="../index.html" class="logo"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="6" fill="currentColor"/></svg>FitGauge</a>
<nav><a href="../profile.html">Profile</a><a href="../index.html#fitness">Fitness</a></nav>
</div>
</header>
<main class="container">
<a href="../index.html" class="back-link">← Back</a>
<div class="page-header">
<h1 class="page-title">1RM Calculator</h1>
<p class="page-desc">Your one rep max strength</p>
</div>
<div class="calculator">
<div class="input-card">
<div class="input-group">
<div class="input-label">Weight lifted (kg)</div>
<input type="number" class="input-field" id="weight" value="60" oninput="calc()">
</div>
<div class="input-group">
<div class="input-label">Reps performed</div>
<input type="number" class="input-field" id="reps" value="5" oninput="calc()">
</div>
</div>
<div class="result-card">
<div class="result-header"><span class="result-badge">💪 1 Rep Max</span></div>
<div class="result-body">
<div class="max-display">
<div class="max-value" id="one-rm">72</div>
<div class="max-label">kg (your max)</div>
</div>
<div class="chart">
<div class="chart-bar"><div class="chart-fill" style="height:95%"></div><div class="chart-pct">95%</div><div class="chart-kg" id="p95">68</div></div>
<div class="chart-bar"><div class="chart-fill" style="height:90%"></div><div class="chart-pct">90%</div><div class="chart-kg" id="p90">65</div></div>
<div class="chart-bar"><div class="chart-fill" style="height:85%"></div><div class="chart-pct">85%</div><div class="chart-kg" id="p85">61</div></div>
<div class="chart-bar"><div class="chart-fill" style="height:80%"></div><div class="chart-pct">80%</div><div class="chart-kg" id="p80">58</div></div>
<div class="chart-bar"><div class="chart-fill" style="height:75%"></div><div class="chart-pct">75%</div><div class="chart-kg" id="p75">54</div></div>
<div class="chart-bar"><div class="chart-fill" style="height:70%"></div><div class="chart-pct">70%</div><div class="chart-kg" id="p70">50</div></div>
</div>
</div>
</div>
</div>
</div>
</main>
<footer>FitGauge</footer>
<script>
function calc(){var w=parseFloat(document.getElementById('weight').value)||60;var r=parseInt(document.getElementById('reps').value)||5;var oneRM=Math.round(w*(1+r/30));document.getElementById('one-rm').textContent=oneRM;document.getElementById('p95').textContent=Math.round(oneRM*0.95);document.getElementById('p90').textContent=Math.round(oneRM*0.90);document.getElementById('p85').textContent=Math.round(oneRM*0.85);document.getElementById('p80').textContent=Math.round(oneRM*0.80);document.getElementById('p75').textContent=Math.round(oneRM*0.75);document.getElementById('p70').textContent=Math.round(oneRM*0.70);}
calc();
</script>
</body>
</html>
