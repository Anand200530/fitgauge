<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Rate Zones - FitGauge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface-hover:#1a1a1a;--border:#262626;--text:#f5f5f5;--text-secondary:#737373;--accent:#22c55e;--blue:#60a5fa;--green:#4ade80;--yellow:#facc15;--orange:#fb923c;--red:#f87171;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
header{padding:20px 0;border-bottom:1px solid var(--border)}
header .container{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:600;color:var(--text);text-decoration:none}
.logo svg{width:26px;height:26px;color:var(--accent)}
nav{display:flex;gap:28px}
nav a{color:var(--text-secondary);font-size:0.85rem;text-decoration:none}
main{padding:48px 0}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.85rem;text-decoration:none;margin-bottom:32px;transition:color 0.2s}
.back-link:hover{color:var(--text)}
.page-header{margin-bottom:40px}
.page-title{font-size:1.75rem;font-weight:600;margin-bottom:8px}
.page-desc{color:var(--text-secondary);font-size:0.9rem}
.calculator{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.input-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
.input-group{margin-bottom:24px}
.input-label{display:block;font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px}
.input-field{width:100%;padding:16px;background:var(--surface-hover);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:1.25rem;text-align:center;font-weight:600;transition:all 0.2s ease}
.input-field:focus{outline:none;border-color:var(--accent)}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.result-header{padding:20px 24px;border-bottom:1px solid var(--border)}
.result-badge{padding:6px 12px;background:rgba(34,197,94,0.15);border-radius:20px;font-size:0.75rem;color:var(--accent)}
.result-body{padding:32px 24px}
.pulse-icon{width:60px;height:30px;margin:0 auto 16px}
.pulse-icon svg{stroke:#f87171}
.max-hr{font-size:3rem;font-weight:600;color:var(--accent);text-align:center;transition:color 0.3s ease}
.max-label{font-size:0.9rem;color:var(--text-secondary);text-align:center}
.zones{margin-top:32px}
.zone-item{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);transition:all 0.2s ease}
.zone-item:last-child{border:none}
.zone-item:hover{padding-left:8px}
.zone-dot{width:12px;height:12px;border-radius:50%;margin-right:12px;transition:transform 0.2s ease}
.zone-info{flex:1}
.zone-name{font-size:0.95rem;font-weight:500}
.zone-range{font-size:0.8rem;color:var(--text-secondary)}
.zone-bpm{font-size:1rem;font-weight:600}
footer{padding:32px 0;border-top:1px solid var(--border);text-align:center;color:var(--text-secondary);font-size:0.8rem;margin-top:48px}
@media(max-width:768px){.calculator{grid-template-columns:1fr}nav{display:none}}
</style>
</head>
<body>
<header>
<div class="container">
<a href="index.html" class="logo"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="6" fill="currentColor"/></svg>FitGauge</a>
<nav><a href="profile.html">Profile</a><a href="index.html#fitness">Fitness</a></nav>
</div>
</header>
<main class="container">
<a href="index.html" class="back-link">← Back</a>
<div class="page-header">
<h1 class="page-title">Heart Rate Zones</h1>
<p class="page-desc">Train at the right intensity</p>
</div>
<div class="calculator">
<div class="input-card">
<div class="input-group">
<div class="input-label">Your Age</div>
<input type="number" class="input-field" id="age" value="25" oninput="calc()">
</div>
</div>
<div class="result-card">
<div class="result-header"><span class="result-badge">Pulse</span></div>
<div class="result-body">
<div class="pulse-icon">
<svg viewBox="0 0 60 30" fill="none" stroke-width="2">
<path d="M0 15 L15 15 L20 15 L25 5 L30 25 L35 10 L40 15 L60 15"/>
</svg>
</div>
<div class="max-hr" id="max-hr">195</div>
<div class="max-label">max heart rate</div>
<div class="zones">
<div class="zone-item"><div class="zone-dot" style="background:var(--blue)"></div><div class="zone-info"><div class="zone-name">Zone 1 - Warm Up</div><div class="zone-range">50-60%</div></div><div class="zone-bpm" id="z1">98-117</div></div>
<div class="zone-item"><div class="zone-dot" style="background:var(--green)"></div><div class="zone-info"><div class="zone-name">Zone 2 - Fat Burn</div><div class="zone-range">60-70%</div></div><div class="zone-bpm" id="z2">117-137</div></div>
<div class="zone-item"><div class="zone-dot" style="background:var(--yellow)"></div><div class="zone-info"><div class="zone-name">Zone 3 - Cardio</div><div class="zone-range">70-80%</div></div><div class="zone-bpm" id="z3">137-156</div></div>
<div class="zone-item"><div class="zone-dot" style="background:var(--orange)"></div><div class="zone-info"><div class="zone-name">Zone 4 - Hard</div><div class="zone-range">80-90%</div></div><div class="zone-bpm" id="z4">156-176</div></div>
<div class="zone-item"><div class="zone-dot" style="background:var(--red)"></div><div class="zone-info"><div class="zone-name">Zone 5 - Max</div><div class="zone-range">90-100%</div></div><div class="zone-bpm" id="z5">176-195</div></div>
</div>
</div>
</div>
</div>
</main>
<footer>FitGauge</footer>
<script>
function calc(){var age=parseInt(document.getElementById('age').value)||25;var max=220-age;document.getElementById('max-hr').textContent=max;document.getElementById('z1').textContent=Math.round(max*0.5)+'-'+Math.round(max*0.6);document.getElementById('z2').textContent=Math.round(max*0.6)+'-'+Math.round(max*0.7);document.getElementById('z3').textContent=Math.round(max*0.7)+'-'+Math.round(max*0.8);document.getElementById('z4').textContent=Math.round(max*0.8)+'-'+Math.round(max*0.9);document.getElementById('z5').textContent=Math.round(max*0.9)+'-'+max;}
function loadProfile(){var age=localStorage.getItem('fitgauge_age');if(age)document.getElementById('age').value=age;calc();}
window.onload=loadProfile;
</script>
</body>
</html>
