<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Split - FitGauge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface-hover:#1a1a1a;--border:#262626;--text:#f5f5f5;--text-secondary:#737373;--accent:#22c55e;--protein:#f97316;--carbs:#60a5fa;--fat:#22c55e;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
header{padding:20px 0;border-bottom:1px solid var(--border)}
header .container{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:600;color:var(--text);text-decoration:none}
.logo svg{width:26px;height:26px;color:var(--accent)}
nav{display:flex;gap:28px}
nav a{color:var(--text-secondary);font-size:0.85rem;text-decoration:none}
main{padding:48px 0}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.85rem;text-decoration:none;margin-bottom:32px}
.page-header{margin-bottom:40px}
.page-title{font-size:1.75rem;font-weight:600;margin-bottom:8px}
.page-desc{color:var(--text-secondary);font-size:0.9rem}
.calculator{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.input-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
.input-group{margin-bottom:20px}
.input-label{font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px}
.input-field{width:100%;padding:14px;background:var(--surface-hover);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:1.1rem;text-align:center;font-weight:600}
.input-field:focus{outline:none;border-color:var(--accent)}
.goal-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal-btn{padding:14px;background:var(--surface-hover);border:2px solid var(--border);border-radius:10px;color:var(--text-secondary);font-size:0.85rem;cursor:pointer;text-align:center}
.goal-btn.active{border-color:var(--accent);color:var(--accent)}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.result-header{padding:20px 24px;border-bottom:1px solid var(--border)}
.result-badge{padding:6px 12px;background:rgba(34,197,94,0.15);border-radius:20px;font-size:0.75rem;color:var(--accent)}
.result-body{padding:32px 24px}
.macro-visual{display:flex;height:24px;border-radius:12px;overflow:hidden;margin-bottom:24px}
.macro-bar{height:100%;transition:width 0.3s ease}
.macro-bar.protein{background:var(--protein)}
.macro-bar.carbs{background:var(--carbs)}
.macro-bar.fat{background:var(--fat)}
.macro-details{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.macro-item{text-align:center;padding:16px;background:var(--surface-hover);border-radius:12px}
.macro-dot{width:12px;height:12px;border-radius:50%;margin:0 auto 8px}
.macro-dot.protein{background:var(--protein)}
.macro-dot.carbs{background:var(--carbs)}
.macro-dot.fat{background:var(--fat)}
.macro-value{font-size:1.5rem;font-weight:600;color:var(--text)}
.macro-label{font-size:0.8rem;color:var(--text-secondary)}
footer{padding:32px 0;border-top:1px solid var(--border);text-align:center;color:var(--text-secondary);font-size:0.8rem;margin-top:48px}
@media(max-width:768px){.calculator{grid-template-columns:1fr}nav{display:none}}
</style>
</head>
<body>
<header>
<div class="container">
<a href="../index.html" class="logo"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="6" fill="currentColor"/></svg>FitGauge</a>
<nav><a href="../profile.html">Profile</a><a href="../index.html#nutrition">Nutrition</a></nav>
</div>
</header>
<main class="container">
<a href="../index.html" class="back-link">← Back</a>
<div class="page-header">
<h1 class="page-title">Macro Split</h1>
<p class="page-desc">Balance your nutrients</p>
</div>
<div class="calculator">
<div class="input-card">
<div class="input-group">
<div class="input-label">Daily Calories</div>
<input type="number" class="input-field" id="calories" value="2000" oninput="calc()">
</div>
<div class="input-group">
<div class="input-label">Goal</div>
<div class="goal-options">
<div class="goal-btn" data-p="30" data-c="40" data-f="30" onclick="setGoal(this)">Lose Fat</div>
<div class="goal-btn active" data-p="30" data-c="40" data-f="30" onclick="setGoal(this)">Maintain</div>
<div class="goal-btn" data-p="25" data-c="50" data-f="25" onclick="setGoal(this)">Energy</div>
<div class="goal-btn" data-p="40" data-c="30" data-f="30" onclick="setGoal(this)">Build Muscle</div>
</div>
</div>
</div>
<div class="result-card">
<div class="result-header"><span class="result-badge">📊 Macros</span></div>
<div class="result-body">
<div class="macro-visual">
<div class="macro-bar protein" id="bar-p" style="width:30%"></div>
<div class="macro-bar carbs" id="bar-c" style="width:40%"></div>
<div class="macro-bar fat" id="bar-f" style="width:30%"></div>
</div>
<div class="macro-details">
<div class="macro-item">
<div class="macro-dot protein"></div>
<div class="macro-value" id="protein">150</div>
<div class="macro-label">Protein (g)</div>
</div>
<div class="macro-item">
<div class="macro-dot carbs"></div>
<div class="macro-value" id="carbs">200</div>
<div class="macro-label">Carbs (g)</div>
</div>
<div class="macro-item">
<div class="macro-dot fat"></div>
<div class="macro-value" id="fat">67</div>
<div class="macro-label">Fat (g)</div>
</div>
</div>
</div>
</div>
</div>
</div>
</main>
<footer>FitGauge</footer>
<script>
var p=30,c=40,f=30;
function setGoal(el){document.querySelectorAll('.goal-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');p=parseInt(el.dataset.p);c=parseInt(el.dataset.c);f=parseInt(el.dataset.f);calc();}
function calc(){var cal=parseInt(document.getElementById('calories').value)||2000;document.getElementById('bar-p').style.width=p+'%';document.getElementById('bar-c').style.width=c+'%';document.getElementById('bar-f').style.width=f+'%';document.getElementById('protein').textContent=Math.round(cal*p/400);document.getElementById('carbs').textContent=Math.round(cal*c/400);document.getElementById('fat').textContent=Math.round(cal*f/900);}
calc();
</script>
</body>
</html>
