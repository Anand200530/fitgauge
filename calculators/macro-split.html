<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Split - FitGauge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface-hover:#1a1a1a;--border:#262626;--text:#f5f5f5;--text-secondary:#737373;--accent:#22c55e;--protein:#f97316;--carbs:#60a5fa;--fat:#22c55e;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
header{padding:20px 0;border-bottom:1px solid var(--border)}
header .container{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:600;color:var(--text);text-decoration:none}
.logo svg{width:26px;height:26px;color:var(--accent)}
nav{display:flex;gap:28px}
nav a{color:var(--text-secondary);font-size:0.85rem;text-decoration:none}
main{padding:48px 0}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.85rem;text-decoration:none;margin-bottom:32px;transition:color 0.2s}
.back-link:hover{color:var(--text)}
.page-header{margin-bottom:40px}
.page-title{font-size:1.75rem;font-weight:600;margin-bottom:8px}
.page-desc{color:var(--text-secondary);font-size:0.9rem}
.calculator{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.input-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
.input-group{margin-bottom:20px}
.input-label{display:block;font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px}
.input-field{width:100%;padding:14px;background:var(--surface-hover);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:1.1rem;text-align:center;font-weight:600;transition:all 0.2s ease}
.input-field:focus{outline:none;border-color:var(--accent)}
.goal-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal-btn{padding:14px;background:var(--surface-hover);border:2px solid var(--border);border-radius:10px;color:var(--text-secondary);font-size:0.85rem;cursor:pointer;text-align:center;transition:all 0.2s ease}
.goal-btn:hover{background:var(--border)}
.goal-btn.active{border-color:var(--accent);color:var(--accent)}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.result-header{padding:20px 24px;border-bottom:1px solid var(--border)}
.result-badge{padding:6px 12px;background:rgba(34,197,94,0.15);border-radius:20px;font-size:0.75rem;color:var(--accent)}
.result-body{padding:32px 24px}
.chart-container{position:relative;width:200px;height:200px;margin:0 auto 24px}
.chart-svg{transform:rotate(-90deg)}
.chart-bg{fill:none;stroke:var(--border);stroke-width:35}
.chart-segment{fill:none;stroke-width:35;stroke-linecap:round;transition:stroke-dasharray 0.3s ease}
.chart-segment.protein{stroke:var(--protein)}
.chart-segment.carbs{stroke:var(--carbs)}
.chart-segment.fat{stroke:var(--fat)}
.chart-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.chart-cal{font-size:1.8rem;font-weight:600;color:var(--text);transition:color 0.3s ease}
.chart-label{font-size:0.8rem;color:var(--text-secondary)}
.macro-details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.macro-item{text-align:center;padding:14px;background:var(--surface-hover);border-radius:12px;transition:all 0.2s ease}
.macro-item:hover{transform:translateY(-2px)}
.macro-dot{width:10px;height:10px;border-radius:50%;margin:0 auto 6px}
.macro-dot.protein{background:var(--protein)}
.macro-dot.carbs{background:var(--carbs)}
.macro-dot.fat{background:var(--fat)}
.macro-value{font-size:1.3rem;font-weight:600;color:var(--text)}
.macro-label{font-size:0.75rem;color:var(--text-secondary)}
footer{padding:32px 0;border-top:1px solid var(--border);text-align:center;color:var(--text-secondary);font-size:0.8rem;margin-top:48px}
@media(max-width:768px){.calculator{grid-template-columns:1fr}nav{display:none}}
</style>
</head>
<body>
<header>
<div class="container">
<a href="index.html" class="logo"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="6" fill="currentColor"/></svg>FitGauge</a>
<nav><a href="profile.html">Profile</a><a href="index.html#nutrition">Nutrition</a></nav>
</div>
</header>
<main class="container">
<a href="index.html" class="back-link">← Back</a>
<div class="page-header">
<h1 class="page-title">Macro Split</h1>
<p class="page-desc">Balance your nutrients</p>
</div>
<div class="calculator">
<div class="input-card">
<div class="input-group">
<div class="input-label">Daily Calories</div>
<input type="number" class="input-field" id="calories" value="2000" oninput="calc()">
</div>
<div class="input-group">
<div class="input-label">Goal</div>
<div class="goal-options">
<div class="goal-btn" data-p="30" data-c="40" data-f="30" onclick="setGoal(this)">Lose Fat</div>
<div class="goal-btn active" data-p="30" data-c="40" data-f="30" onclick="setGoal(this)">Maintain</div>
<div class="goal-btn" data-p="25" data-c="50" data-f="25" onclick="setGoal(this)">Energy</div>
<div class="goal-btn" data-p="40" data-c="30" data-f="30" onclick="setGoal(this)">Build Muscle</div>
</div>
</div>
</div>
<div class="result-card">
<div class="result-header"><span class="result-badge">📊 Macros</span></div>
<div class="result-body">
<div class="chart-container">
<svg class="chart-svg" width="200" height="200" viewBox="0 0 200 200">
<circle class="chart-bg" cx="100" cy="100" r="82"/>
<circle class="chart-segment protein" id="seg-p" cx="100" cy="100" r="82" stroke-dasharray="0 515"/>
<circle class="chart-segment carbs" id="seg-c" cx="100" cy="100" r="82" stroke-dasharray="0 515"/>
<circle class="chart-segment fat" id="seg-f" cx="100" cy="100" r="82" stroke-dasharray="0 515"/>
</svg>
<div class="chart-center">
<div class="chart-cal" id="chart-cal">2000</div>
<div class="chart-label">kcal</div>
</div>
</div>
<div class="macro-details">
<div class="macro-item">
<div class="macro-dot protein"></div>
<div class="macro-value" id="protein">150g</div>
<div class="macro-label">Protein</div>
</div>
<div class="macro-item">
<div class="macro-dot carbs"></div>
<div class="macro-value" id="carbs">200g</div>
<div class="macro-label">Carbs</div>
</div>
<div class="macro-item">
<div class="macro-dot fat"></div>
<div class="macro-value" id="fat">67g</div>
<div class="macro-label">Fat</div>
</div>
</div>
</div>
</div>
</div>
</div>
</main>
<footer>FitGauge</footer>
<script>
var p=30,c=40,f=30;
function setGoal(el){document.querySelectorAll('.goal-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');p=parseInt(el.dataset.p);c=parseInt(el.dataset.c);f=parseInt(el.dataset.f);calc();}
function calc(){var cal=parseInt(document.getElementById('calories').value)||2000;var total=515;var lenP=total*p/100;var lenC=total*c/100;var lenF=total*f/100;document.getElementById('seg-p').setAttribute('stroke-dasharray',lenP+' '+(total-lenP));document.getElementById('seg-c').setAttribute('stroke-dasharray',lenC+' '+(total-lenC));document.getElementById('seg-f').setAttribute('stroke-dasharray',lenF+' '+(total-lenF));document.getElementById('chart-cal').textContent=cal;document.getElementById('protein').textContent=Math.round(cal*p/400)+'g';document.getElementById('carbs').textContent=Math.round(cal*c/400)+'g';document.getElementById('fat').textContent=Math.round(cal*f/900)+'g';}
calc();
</script>
</body>
</html>
