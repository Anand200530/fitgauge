<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - FitGauge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0a; --surface: #141414; --surface-hover: #1a1a1a; --border: #262626; --text: #f5f5f5; --text-secondary: #737373; --accent: #22c55e; --blue: #60a5fa; --green: #4ade80; --yellow: #facc15; --orange: #fb923c; --red: #f87171; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
        header { padding: 20px 0; border-bottom: 1px solid var(--border); }
        header .container { display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 600; color: var(--text); text-decoration: none; }
        .logo svg { width: 26px; height: 26px; color: var(--accent); }
        nav { display: flex; gap: 28px; }
        nav a { color: var(--text-secondary); font-size: 0.85rem; text-decoration: none; }
        main { padding: 48px 0; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 0.85rem; text-decoration: none; margin-bottom: 32px; }
        .page-header { margin-bottom: 40px; }
        .page-title { font-size: 1.75rem; font-weight: 600; margin-bottom: 8px; }
        .page-desc { color: var(--text-secondary); font-size: 0.9rem; }
        .calculator { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        
        .input-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
        .gender-toggle { display: flex; gap: 12px; margin-bottom: 32px; }
        .gender-btn { flex: 1; padding: 16px; background: var(--surface-hover); border: 2px solid var(--border); border-radius: 12px; color: var(--text-secondary); font-size: 1rem; cursor: pointer; text-align: center; }
        .gender-btn.active { border-color: var(--accent); color: var(--accent); }
        
        .input-group { margin-bottom: 24px; }
        .input-label { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; }
        .input-field { width: 100%; padding: 16px; background: var(--surface-hover); border: 2px solid var(--border); border-radius: 12px; color: var(--text); font-size: 1.25rem; text-align: center; font-weight: 600; }
        .input-field:focus { outline: none; border-color: var(--accent); }
        
        .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
        .result-header { padding: 20px 24px; border-bottom: 1px solid var(--border); }
        .result-badge { padding: 6px 12px; background: rgba(34, 197, 94, 0.15); border-radius: 20px; font-size: 0.75rem; color: var(--accent); }
        .result-body { padding: 48px 24px; text-align: center; }
        
        /* Ring Gauge */
        .ring-wrap { width: 200px; height: 200px; margin: 0 auto 32px; position: relative; }
        .ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .ring-bg { fill: none; stroke: var(--border); stroke-width: 14; }
        .ring-fill { fill: none; stroke-width: 14; stroke-linecap: round; stroke-dasharray: 502; stroke-dashoffset: 502; transition: stroke-dashoffset 1s, stroke 0.5s; }
        .ring-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .ring-value { font-size: 3rem; font-weight: 600; line-height: 1; }
        .ring-label { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
        
        .status-row { display: flex; justify-content: center; gap: 16px; margin-top: 24px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        
        .target-section { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 24px; border-top: 1px solid var(--border); margin-top: 24px; }
        .target-item { background: var(--surface-hover); border-radius: 12px; padding: 16px; }
        .target-value { font-size: 1.25rem; font-weight: 600; }
        .target-label { font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; }
        
        footer { padding: 32px 0; border-top: 1px solid var(--border); text-align: center; color: var(--text-secondary); font-size: 0.8rem; margin-top: 48px; }
        @media (max-width: 768px) { .calculator { grid-template-columns: 1fr; } nav { display: none; } }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="../index.html" class="logo"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="6" fill="currentColor"/></svg>FitGauge</a>
            <nav><a href="../profile.html">Profile</a><a href="../index.html#body">Body</a></nav>
        </div>
    </header>
    <main class="container">
        <a href="../index.html" class="back-link">← Back</a>
        <div class="page-header"><h1 class="page-title">Body Mass Index</h1><p class="page-desc">Check your body mass index</p></div>
        <div class="calculator">
            <div class="input-card">
                <div class="gender-toggle">
                    <div class="gender-btn" id="male-btn" onclick="setGender('male')">♂ Male</div>
                    <div class="gender-btn active" id="female-btn" onclick="setGender('female')">♀ Female</div>
                </div>
                <div class="input-group"><div class="input-label">Age (years)</div><input type="number" class="input-field" id="age" value="25" oninput="calculate()"></div>
                <div class="input-group"><div class="input-label">Height (cm)</div><input type="number" class="input-field" id="height" value="170" oninput="calculate()"></div>
                <div class="input-group"><div class="input-label">Weight (kg)</div><input type="number" class="input-field" id="weight" value="65" oninput="calculate()"></div>
            </div>
            <div class="result-card">
                <div class="result-header"><span class="result-badge">BMI</span></div>
                <div class="result-body">
                    <div class="ring-wrap">
                        <svg class="ring-svg" viewBox="0 0 200 200"><circle class="ring-bg" cx="100" cy="100" r="80"/><circle class="ring-fill" id="ring" cx="100" cy="100" r="80"/></svg>
                        <div class="ring-center"><div class="ring-value" id="bmi">22.9</div><div class="ring-label">Body Mass Index</div></div>
                    </div>
                    <div class="status-row">
                        <div class="status-dot" style="background: var(--blue)"></div>
                        <div class="status-dot" style="background: var(--green)"></div>
                        <div class="status-dot" style="background: var(--yellow)"></div>
                        <div class="status-dot" style="background: var(--red)"></div>
                    </div>
                    <div class="target-section">
                        <div class="target-item"><div class="target-value" id="tmin">54</div><div class="target-label">Min (kg)</div></div>
                        <div class="target-item"><div class="target-value" id="tmax">72</div><div class="target-label">Max (kg)</div></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>FitGauge</footer>
    <script>
        var gender = 'female';
        function setGender(g) { gender = g; document.getElementById('male-btn').classList.toggle('active', g === 'male'); document.getElementById('female-btn').classList.toggle('active', g === 'female'); calculate(); }
        function calculate() {
            var h = parseInt(document.getElementById('height').value) || 170;
            var w = parseInt(document.getElementById('weight').value) || 65;
            var bmi = w / ((h/100) * (h/100));
            bmi = Math.round(bmi * 10) / 10;
            var c = bmi < 18.5 ? 'var(--blue)' : bmi < 25 ? 'var(--green)' : bmi < 30 ? 'var(--yellow)' : 'var(--red)';
            document.getElementById('bmi').textContent = bmi;
            document.getElementById('bmi').style.color = c;
            var p = Math.min(100, Math.max(0, ((bmi - 15) / 25) * 100));
            var ring = document.getElementById('ring');
            ring.style.stroke = c;
            ring.style.strokeDashoffset = 502 - (p / 100) * 502;
            var hm = h / 100;
            document.getElementById('tmin').textContent = Math.round(18.5 * hm * hm);
            document.getElementById('tmax').textContent = Math.round(25 * hm * hm);
        }
        function loadProfile() {
            var g = localStorage.getItem('fitgauge_gender');
            var a = localStorage.getItem('fitgauge_age');
            var h = localStorage.getItem('fitgauge_height');
            var w = localStorage.getItem('fitgauge_weight');
            var wU = localStorage.getItem('fitgauge_weight_unit') || 'kg';
            if (g) setGender(g);
            if (a) document.getElementById('age').value = a;
            if (h) document.getElementById('height').value = h;
            if (w) { var weight = parseFloat(w); if (wU === 'lbs') weight = Math.round(weight * 0.453592); document.getElementById('weight').value = weight; }
            calculate();
        }
        window.onload = loadProfile;
    </script>
</body>
</html>
