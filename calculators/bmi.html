<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - FitGauge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0a; --surface: #141414; --surface-hover: #1a1a1a; --border: #262626; --text: #f5f5f5; --text-secondary: #737373; --accent: #22c55e; --blue: #60a5fa; --green: #4ade80; --yellow: #facc15; --orange: #fb923c; --red: #f87171; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
        header { padding: 20px 0; border-bottom: 1px solid var(--border); }
        header .container { display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 600; color: var(--text); text-decoration: none; }
        .logo svg { width: 26px; height: 26px; color: var(--accent); }
        nav { display: flex; gap: 28px; }
        nav a { color: var(--text-secondary); font-size: 0.85rem; text-decoration: none; }
        main { padding: 48px 0; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 0.85rem; text-decoration: none; margin-bottom: 32px; }
        .page-header { margin-bottom: 40px; }
        .page-title { font-size: 1.75rem; font-weight: 600; margin-bottom: 8px; }
        .page-desc { color: var(--text-secondary); font-size: 0.9rem; }
        .calculator { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        
        .input-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
        .gender-toggle { display: flex; gap: 12px; margin-bottom: 32px; }
        .gender-btn { flex: 1; padding: 16px; background: var(--surface-hover); border: 2px solid var(--border); border-radius: 12px; color: var(--text-secondary); font-size: 1rem; cursor: pointer; text-align: center; transition: all 0.2s; }
        .gender-btn.active { border-color: var(--accent); color: var(--accent); }
        
        .input-group { margin-bottom: 24px; }
        .input-label { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; }
        .input-field { width: 100%; padding: 16px; background: var(--surface-hover); border: 2px solid var(--border); border-radius: 12px; color: var(--text); font-size: 1.25rem; text-align: center; font-weight: 600; }
        .input-field:focus { outline: none; border-color: var(--accent); }
        
        .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
        .result-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .result-badge { padding: 6px 12px; background: rgba(34, 197, 94, 0.15); border-radius: 20px; font-size: 0.75rem; color: var(--accent); }
        .result-body { padding: 40px 24px; text-align: center; }
        
        .gauge-wrapper { width: 240px; height: 240px; margin: 0 auto 32px; position: relative; }
        .gauge-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .gauge-bg { fill: none; stroke: var(--border); stroke-width: 14; }
        .gauge-progress { fill: none; stroke-width: 14; stroke-linecap: round; stroke-dasharray: 565; stroke-dashoffset: 565; transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.5s; }
        
        .gauge-inner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .gauge-value { font-size: 3.5rem; font-weight: 600; line-height: 1; transition: color 0.3s; }
        .gauge-label { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
        
        .status-dots { display: flex; justify-content: center; gap: 16px; margin-top: 24px; }
        .status-dot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-label { font-size: 0.65rem; color: var(--text-secondary); }
        
        .target-section { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 24px; border-top: 1px solid var(--border); margin-top: 24px; }
        .target-item { background: var(--surface-hover); border-radius: 12px; padding: 16px; }
        .target-value { font-size: 1.25rem; font-weight: 600; }
        .target-label { font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; }
        
        footer { padding: 32px 0; border-top: 1px solid var(--border); text-align: center; color: var(--text-secondary); font-size: 0.8rem; margin-top: 48px; }
        @media (max-width: 768px) { .calculator { grid-template-columns: 1fr; } nav { display: none; } .gauge-wrapper { width: 200px; height: 200px; } .gauge-value { font-size: 2.5rem; } }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="../index.html" class="logo">
                <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="6" fill="currentColor"/></svg>
                FitGauge
            </a>
            <nav><a href="../profile.html">Profile</a><a href="../index.html#body">Body</a></nav>
        </div>
    </header>
    <main class="container">
        <a href="../index.html" class="back-link">← Back</a>
        <div class="page-header">
            <h1 class="page-title">Body Mass Index</h1>
            <p class="page-desc">Check your body mass index</p>
        </div>
        <div class="calculator">
            <div class="input-card">
                <div class="gender-toggle">
                    <div class="gender-btn" id="male-btn" onclick="setGender('male')">♂ Male</div>
                    <div class="gender-btn active" id="female-btn" onclick="setGender('female')">♀ Female</div>
                </div>
                <div class="input-group">
                    <div class="input-label">Age (years)</div>
                    <input type="number" class="input-field" id="age" value="25" oninput="calculate()">
                </div>
                <div class="input-group">
                    <div class="input-label">Height (cm)</div>
                    <input type="number" class="input-field" id="height" value="170" oninput="calculate()">
                </div>
                <div class="input-group">
                    <div class="input-label">Weight (kg)</div>
                    <input type="number" class="input-field" id="weight" value="65" oninput="calculate()">
                </div>
            </div>
            <div class="result-card">
                <div class="result-header"><span class="result-badge">BMI</span></div>
                <div class="result-body">
                    <div class="gauge-wrapper">
                        <svg class="gauge-svg" viewBox="0 0 220 220">
                            <circle class="gauge-bg" cx="110" cy="110" r="90"/>
                            <circle class="gauge-progress" id="gauge" cx="110" cy="110" r="90"/>
                        </svg>
                        <div class="gauge-inner">
                            <div class="gauge-value" id="bmi-value">22.9</div>
                            <div class="gauge-label">Body Mass Index</div>
                        </div>
                    </div>
                    <div class="status-dots">
                        <div class="status-dot"><div class="dot" style="background: var(--blue)"></div><span class="dot-label">Under</span></div>
                        <div class="status-dot"><div class="dot" style="background: var(--green)"></div><span class="dot-label">Normal</span></div>
                        <div class="status-dot"><div class="dot" style="background: var(--yellow)"></div><span class="dot-label">Over</span></div>
                        <div class="status-dot"><div class="dot" style="background: var(--red)"></div><span class="dot-label">Obese</span></div>
                    </div>
                    <div class="target-section">
                        <div class="target-item"><div class="target-value" id="target-min">54</div><div class="target-label">Min (kg)</div></div>
                        <div class="target-item"><div class="target-value" id="target-max">72</div><div class="target-label">Max (kg)</div></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>FitGauge</footer>
    <script>
        var state = { gender: 'female', age: 25, height: 170, weight: 65 };
        
        function setGender(g) { state.gender = g; document.getElementById('male-btn').classList.toggle('active', g === 'male'); document.getElementById('female-btn').classList.toggle('active', g === 'female'); calculate(); }
        
        function calculate() {
            state.age = parseInt(document.getElementById('age').value) || 25;
            state.height = parseInt(document.getElementById('height').value) || 170;
            state.weight = parseInt(document.getElementById('weight').value) || 65;
            
            var hM = state.height / 100;
            var bmi = state.weight / (hM * hM);
            bmi = Math.round(bmi * 10) / 10;
            
            var color;
            if (bmi < 18.5) color = 'var(--blue)';
            else if (bmi < 25) color = 'var(--green)';
            else if (bmi < 30) color = 'var(--yellow)';
            else color = 'var(--red)';
            
            document.getElementById('bmi-value').textContent = bmi;
            document.getElementById('bmi-value').style.color = color;
            
            var pct = ((bmi - 15) / 25) * 100;
            pct = Math.max(0, Math.min(100, pct));
            
            var gauge = document.getElementById('gauge');
            gauge.style.stroke = color;
            gauge.style.strokeDashoffset = 565 - (pct / 100) * 565;
            
            var min = Math.round(18.5 * hM * hM);
            var max = Math.round(25 * hM * hM);
            document.getElementById('target-min').textContent = min;
            document.getElementById('target-max').textContent = max;
        }
        
        function loadProfile() {
            var g = localStorage.getItem('fitgauge_gender');
            var age = localStorage.getItem('fitgauge_age');
            var h = localStorage.getItem('fitgauge_height');
            var w = localStorage.getItem('fitgauge_weight');
            var wU = localStorage.getItem('fitgauge_weight_unit') || 'kg';
            if (g) setGender(g);
            if (age) document.getElementById('age').value = age;
            if (h) document.getElementById('height').value = h;
            if (w) {
                var weight = parseFloat(w);
                if (wU === 'lbs') weight = Math.round(weight * 0.453592);
                document.getElementById('weight').value = weight;
            }
            calculate();
        }
        
        window.onload = loadProfile;
    </script>
</body>
</html>
