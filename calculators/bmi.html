<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - FitGauge</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="description" content="Precision BMI Calculator - Interactive health metric">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="../index.html" class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
                        <circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="1.5"/>
                        <circle cx="20" cy="20" r="6" fill="currentColor"/>
                        <line x1="20" y1="2" x2="20" y2="6" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="20" y1="34" x2="20" y2="38" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="2" y1="20" x2="6" y2="20" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="34" y1="20" x2="38" y2="20" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                </div>
                <span class="logo-text">FitGauge</span>
            </a>
            <nav class="nav">
                <a href="../index.html#calculators" class="nav-link">All Calculators</a>
            </nav>
        </div>
    </header>

    <main class="calculator-page">
        <div class="instrument-container">
            <!-- Left Panel - Inputs -->
            <div class="instrument-panel input-panel">
                <div class="panel-header">
                    <h2 class="panel-title">Input</h2>
                    <span class="panel-subtitle">Enter your measurements</span>
                </div>

                <div class="input-section">
                    <div class="input-row">
                        <div class="input-field-large">
                            <label>Height</label>
                            <div class="height-inputs">
                                <input type="number" id="feet" placeholder="ft" min="1" max="9">
                                <span class="unit-separator">'</span>
                                <input type="number" id="inches" placeholder="in" min="0" max="11">
                                <span class="unit-label">or</span>
                                <input type="number" id="height-cm" placeholder="cm" min="50" max="300">
                            </div>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-field-large">
                            <label>Weight</label>
                            <div class="weight-input">
                                <input type="number" id="weight" placeholder="0" min="20" max="500" step="0.1">
                                <div class="unit-toggle">
                                    <button class="unit-btn active" data-unit="kg">kg</button>
                                    <button class="unit-btn" data-unit="lbs">lbs</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-field-large">
                            <label>Age</label>
                            <input type="number" id="age" placeholder="Years" min="2" max="120">
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-field-large">
                            <label>Gender</label>
                            <div class="gender-toggle">
                                <button class="gender-btn" data-gender="male">Male</button>
                                <button class="gender-btn active" data-gender="female">Female</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Display -->
            <div class="instrument-panel display-panel">
                <div class="panel-header">
                    <h2 class="panel-title">Measurement</h2>
                    <span class="panel-subtitle">Your BMI reading</span>
                </div>

                <div class="gauge-container">
                    <canvas id="bmi-gauge"></canvas>
                    <div class="gauge-reading">
                        <span id="bmi-value" class="reading-value">--</span>
                        <span class="reading-unit">kg/m²</span>
                    </div>
                </div>

                <div class="scale-indicators">
                    <div class="scale-item">
                        <span class="scale-color underweight"></span>
                        <span class="scale-label">&lt; 18.5</span>
                    </div>
                    <div class="scale-item">
                        <span class="scale-color normal"></span>
                        <span class="scale-label">18.5 - 24.9</span>
                    </div>
                    <div class="scale-item">
                        <span class="scale-color overweight"></span>
                        <span class="scale-label">25 - 29.9</span>
                    </div>
                    <div class="scale-item">
                        <span class="scale-color obese"></span>
                        <span class="scale-label">&ge; 30</span>
                    </div>
                </div>

                <div id="result-card" class="result-display">
                    <div class="result-header">
                        <span class="result-label">Classification</span>
                        <span id="classification" class="result-value">--</span>
                    </div>
                    <div class="result-detail">
                        <p id="result-text">Enter your details to see your BMI classification</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <style>
        .instrument-container {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 24px;
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 24px 60px;
        }

        .instrument-panel {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: 16px;
            overflow: hidden;
        }

        .input-panel {
            padding: 24px;
        }

        .display-panel {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .panel-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--color-border);
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .panel-subtitle {
            font-size: 0.875rem;
            color: var(--color-text-muted);
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .input-field-large label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-text-secondary);
            margin-bottom: 8px;
        }

        .height-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .height-inputs input {
            width: 70px;
            padding: 12px;
            background: var(--color-bg-tertiary);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            color: var(--color-text);
            font-size: 1.25rem;
            text-align: center;
        }

        .height-inputs input:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .unit-separator, .unit-label {
            color: var(--color-text-muted);
            font-size: 0.875rem;
        }

        #height-cm {
            width: 100px !important;
        }

        .weight-input {
            display: flex;
            gap: 12px;
        }

        .weight-input input {
            flex: 1;
            padding: 12px 16px;
            background: var(--color-bg-tertiary);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            color: var(--color-text);
            font-size: 1.5rem;
            font-weight: 600;
        }

        .weight-input input:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .unit-toggle {
            display: flex;
            background: var(--color-bg-tertiary);
            border-radius: 8px;
            overflow: hidden;
        }

        .unit-btn {
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: var(--color-text-muted);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .unit-btn.active {
            background: var(--color-accent);
            color: white;
        }

        .gender-toggle {
            display: flex;
            background: var(--color-bg-tertiary);
            border-radius: 8px;
            overflow: hidden;
        }

        .gender-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--color-text-muted);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .gender-btn.active {
            background: var(--color-accent);
            color: white;
        }

        .gauge-container {
            position: relative;
            width: 280px;
            height: 160px;
            margin: 20px 0;
        }

        .gauge-reading {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .reading-value {
            display: block;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--color-text);
            line-height: 1;
        }

        .reading-unit {
            font-size: 0.875rem;
            color: var(--color-text-muted);
        }

        .scale-indicators {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin: 24px 0;
            padding: 16px;
            background: var(--color-bg-tertiary);
            border-radius: 8px;
        }

        .scale-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .scale-color {
            width: 24px;
            height: 8px;
            border-radius: 4px;
        }

        .scale-color.underweight { background: #06b6d4; }
        .scale-color.normal { background: #10b981; }
        .scale-color.overweight { background: #f59e0b; }
        .scale-color.obese { background: #ef4444; }

        .scale-label {
            font-size: 0.7rem;
            color: var(--color-text-muted);
        }

        .result-display {
            width: 100%;
            padding: 20px;
            background: var(--color-bg-tertiary);
            border-radius: 12px;
            border-left: 4px solid var(--color-border);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result-label {
            font-size: 0.875rem;
            color: var(--color-text-muted);
        }

        .result-value {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .result-value.underweight { color: #06b6d4; }
        .result-value.normal { color: #10b981; }
        .result-value.overweight { color: #f59e0b; }
        .result-value.obese { color: #ef4444; }

        .result-detail p {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .instrument-container {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        let weightUnit = 'kg';
        let gender = 'female';
        let bmiChart = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            createGauge();
            setupEventListeners();
        });

        function createGauge() {
            const ctx = document.getElementById('bmi-gauge').getContext('2d');
            
            bmiChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['0', '15', '18.5', '25', '30', '35', '40'],
                    datasets: [{
                        data: [0, 0, 0, 0, 0, 0, 0],
                        borderColor: '#3b82f6',
                        borderWidth: 3,
                        fill: true,
                        backgroundColor: function(context) {
                            const chart = context.chart;
                            const {ctx, chartArea} = chart;
                            if (!chartArea) return null;
                            
                            const gradient = ctx.createLinearGradient(chartArea.left, 0, chartArea.right, 0);
                            gradient.addColorStop(0, '#06b6d4');
                            gradient.addColorStop(0.35, '#10b981');
                            gradient.addColorStop(0.55, '#f59e0b');
                            gradient.addColorStop(0.7, '#ef4444');
                            return gradient;
                        },
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    },
                    scales: {
                        x: { display: false },
                        y: { display: false }
                    },
                    animation: {
                        duration: 500
                    }
                }
            });
        }

        function setupEventListeners() {
            // Unit toggles
            document.querySelectorAll('.unit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    weightUnit = this.dataset.unit;
                    calculateBMI();
                });
            });

            // Gender toggle
            document.querySelectorAll('.gender-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    gender = this.dataset.gender;
                    calculateBMI();
                });
            });

            // Input listeners
            ['feet', 'inches', 'height-cm', 'weight', 'age'].forEach(id => {
                document.getElementById(id).addEventListener('input', calculateBMI);
            });
        }

        function calculateBMI() {
            let heightCm = parseFloat(document.getElementById('height-cm').value) || 0;
            
            const feet = parseFloat(document.getElementById('feet').value) || 0;
            const inches = parseFloat(document.getElementById('inches').value) || 0;
            
            if (!heightCm && (feet || inches)) {
                heightCm = (feet * 30.48) + (inches * 2.54);
            }
            
            let weight = parseFloat(document.getElementById('weight').value) || 0;
            
            if (weightUnit === 'lbs') {
                weight = weight * 0.453592;
            }
            
            if (!heightCm || !weight) {
                return;
            }
            
            const heightM = heightCm / 100;
            const bmi = weight / (heightM * heightM);
            
            if (bmi && bmi > 0 && bmi < 60) {
                updateDisplay(bmi);
            }
        }

        function updateDisplay(bmi) {
            // Update gauge needle position (simulated with bar)
            const normalizedPos = Math.min(Math.max((bmi - 10) / 35, 0), 1);
            bmiChart.data.datasets[0].data = [
                0, 
                normalizedPos < 0.2 ? normalizedPos * 5 : 1,
                normalizedPos < 0.35 ? normalizedPos * 2.86 : 1,
                normalizedPos < 0.55 ? normalizedPos * 1.82 : 1,
                normalizedPos < 0.7 ? normalizedPos * 1.43 : 1,
                normalizedPos < 0.85 ? normalizedPos * 1.25 : 1,
                normalizedPos <= 1 ? normalizedPos * 1.14 : 1
            ];
            bmiChart.update('none');

            // Update value
            document.getElementById('bmi-value').textContent = bmi.toFixed(1);
            
            // Classification
            const classification = document.getElementById('classification');
            const resultText = document.getElementById('result-text');
            const resultCard = document.getElementById('result-card');
            
            let classificationText = '';
            let colorClass = '';
            let description = '';
            
            if (bmi < 18.5) {
                classificationText = 'Underweight';
                colorClass = 'underweight';
                description = 'Your BMI suggests you may be underweight. Consider consulting a healthcare provider about healthy nutrition strategies.';
            } else if (bmi < 25) {
                classificationText = 'Normal Weight';
                colorClass = 'normal';
                description = 'Your BMI is within the healthy range. Maintain your current lifestyle for continued health.';
            } else if (bmi < 30) {
                classificationText = 'Overweight';
                colorClass = 'overweight';
                description = 'Your BMI suggests overweight. Consider lifestyle modifications like balanced nutrition and regular activity.';
            } else {
                classificationText = 'Obesity';
                colorClass = 'obese';
                description = 'Your BMI indicates obesity. Consult a healthcare provider for personalized guidance.';
            }
            
            classification.textContent = classificationText;
            classification.className = 'result-value ' + colorClass;
            resultText.textContent = description;
            resultCard.style.borderLeftColor = `var(--color-${colorClass})`;
            document.getElementById('bmi-value').style.color = `var(--color-${colorClass})`;
        }
    </script>
</body>
</html>
