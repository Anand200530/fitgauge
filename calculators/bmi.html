<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator — FitGauge</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="description" content="Calculate your BMI">
</head>
<body>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --border: #262626;
            --text: #f5f5f5;
            --text-secondary: #737373;
            --accent: #22c55e;
            --blue: #3b82f6;
            --yellow: #eab308;
            --red: #ef4444;
            --font: 'Inter', sans-serif;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        
        header {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        
        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .logo svg { width: 26px; height: 26px; color: var(--accent); }
        
        nav { display: flex; gap: 28px; }
        
        nav a {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-decoration: none;
        }
        
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 48px 24px;
        }
        
        .page-header { margin-bottom: 48px; }
        
        .page-title { font-size: 1.75rem; font-weight: 600; margin-bottom: 8px; }
        
        .page-desc { color: var(--text-secondary); font-size: 0.9rem; }
        
        .calculator {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
        }
        
        .form-section { display: flex; flex-direction: column; gap: 24px; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        
        .form-label { font-size: 0.85rem; color: var(--text-secondary); }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: var(--font);
            font-size: 1rem;
        }
        
        .form-input:focus { outline: none; border-color: var(--accent); }
        
        .form-input::placeholder { color: var(--text-secondary); }
        
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .toggle-group {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .toggle-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font);
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        .toggle-btn.active { background: var(--accent); color: var(--bg); }
        
        .result-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
        }
        
        .gauge-container {
            position: relative;
            width: 280px;
            height: 160px;
            margin-bottom: 32px;
        }
        
        .gauge-bg { position: absolute; width: 100%; height: 100%; }
        
        .gauge-value {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        
        .gauge-number {
            font-size: 3.5rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1;
            transition: color 0.3s;
        }
        
        .gauge-unit { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
        
        .range-bar {
            display: flex;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 16px;
            width: 100%;
        }
        
        .range-under { background: var(--blue); flex: 1.5; }
        .range-normal { background: var(--accent); flex: 2; }
        .range-over { background: var(--yellow); flex: 1.5; }
        .range-obese { background: var(--red); flex: 1; }
        
        .range-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        
        .result-class {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 8px;
            transition: color 0.3s;
        }
        
        .result-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 280px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-decoration: none;
            margin-bottom: 32px;
        }
        
        footer {
            padding: 24px 0;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        
        @media (max-width: 768px) {
            .calculator { grid-template-columns: 1fr; }
            nav { display: none; }
            .gauge-container { width: 240px; height: 140px; }
            .gauge-number { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <svg viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
                    <circle cx="20" cy="20" r="12" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="20" cy="20" r="6" fill="currentColor"/>
                    <line x1="20" y1="2" x2="20" y2="6" stroke="currentColor" stroke-width="1.5"/>
                    <line x1="20" y1="34" x2="20" y2="38" stroke="currentColor" stroke-width="1.5"/>
                    <line x1="2" y1="20" x2="6" y2="20" stroke="currentColor" stroke-width="1.5"/>
                    <line x1="34" y1="20" x2="38" y2="20" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                FitGauge
            </a>
            <nav>
                <a href="index.html#body">Body</a>
                <a href="index.html#energy">Energy</a>
                <a href="index.html#nutrition">Nutrition</a>
                <a href="index.html#fitness">Fitness</a>
                <a href="index.html#goals">Goals</a>
            </nav>
        </div>
    </header>

    <main>
        <a href="index.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to calculators
        </a>

        <div class="page-header">
            <h1 class="page-title">Body Mass Index</h1>
            <p class="page-desc">Calculate your BMI using standard WHO classification</p>
        </div>

        <div class="calculator">
            <div class="form-section">
                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <div class="toggle-group">
                        <button class="toggle-btn" data-value="male">Male</button>
                        <button class="toggle-btn active" data-value="female">Female</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Age</label>
                    <input type="number" class="form-input" id="age" placeholder="Years" min="2" max="120">
                </div>

                <div class="form-group">
                    <label class="form-label">Height</label>
                    <div class="input-row">
                        <input type="number" class="form-input" id="feet" placeholder="ft" min="1" max="9">
                        <input type="number" class="form-input" id="inches" placeholder="in" min="0" max="11">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Weight (kg)</label>
                    <input type="number" class="form-input" id="weight" placeholder="kg" min="20" max="300">
                </div>
            </div>

            <div class="result-section">
                <div class="gauge-container">
                    <svg class="gauge-bg" viewBox="0 0 280 140">
                        <defs>
                            <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#3b82f6"/>
                                <stop offset="35%" stop-color="#22c55e"/>
                                <stop offset="55%" stop-color="#eab308"/>
                                <stop offset="70%" stop-color="#ef4444"/>
                            </linearGradient>
                        </defs>
                        <path d="M 20 140 A 120 120 0 0 1 260 140" 
                              fill="none" 
                              stroke="url(#gaugeGrad)" 
                              stroke-width="16" 
                              stroke-linecap="round"/>
                    </svg>
                    <div class="gauge-value">
                        <div class="gauge-number" id="bmi-value">--</div>
                        <div class="gauge-unit">kg/m2</div>
                    </div>
                </div>

                <div class="range-bar">
                    <div class="range-under"></div>
                    <div class="range-normal"></div>
                    <div class="range-over"></div>
                    <div class="range-obese"></div>
                </div>
                <div class="range-labels">
                    <span>15</span>
                    <span>18.5</span>
                    <span>25</span>
                    <span>30</span>
                    <span>35</span>
                </div>

                <div class="result-class" id="result-class">Enter your details</div>
                <p class="result-desc" id="result-desc">Add your measurements to calculate BMI</p>
            </div>
        </div>
    </main>

    <footer>
        FitGauge - Precision Fitness Calculators
    </footer>

    <script>
        let gender = 'female';
        
        document.querySelectorAll('.toggle-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var parent = this.parentElement;
                parent.querySelectorAll('.toggle-btn').forEach(function(b) {
                    b.classList.remove('active');
                });
                this.classList.add('active');
                gender = this.dataset.value;
                calculateBMI();
            });
        });
        
        ['feet', 'inches', 'weight', 'age'].forEach(function(id) {
            document.getElementById(id).addEventListener('input', calculateBMI);
        });
        
        function calculateBMI() {
            var heightCm = 0;
            
            var feet = parseFloat(document.getElementById('feet').value) || 0;
            var inches = parseFloat(document.getElementById('inches').value) || 0;
            
            if (feet || inches) {
                heightCm = (feet * 30.48) + (inches * 2.54);
            }
            
            var weight = parseFloat(document.getElementById('weight').value) || 0;
            
            if (!heightCm || !weight) return;
            
            var heightM = heightCm / 100;
            var bmi = weight / (heightM * heightM);
            
            if (bmi > 10 && bmi < 60) {
                updateDisplay(bmi);
            }
        }
        
        function updateDisplay(bmi) {
            var valueEl = document.getElementById('bmi-value');
            var classEl = document.getElementById('result-class');
            var descEl = document.getElementById('result-desc');
            
            valueEl.textContent = bmi.toFixed(1);
            
            var color, classText, desc;
            
            if (bmi < 18.5) {
                color = '#3b82f6';
                classText = 'Underweight';
                desc = 'Your BMI suggests you may be underweight. Consider consulting a healthcare provider.';
            } else if (bmi < 25) {
                color = '#22c55e';
                classText = 'Normal';
                desc = 'Your BMI is within the healthy range. Maintain your current lifestyle.';
            } else if (bmi < 30) {
                color = '#eab308';
                classText = 'Overweight';
                desc = 'Your BMI suggests overweight. Consider lifestyle modifications.';
            } else {
                color = '#ef4444';
                classText = 'Obesity';
                desc = 'Your BMI indicates obesity. Consult a healthcare provider for personalized advice.';
            }
            
            valueEl.style.color = color;
            classEl.style.color = color;
            classEl.textContent = classText;
            descEl.textContent = desc;
        }
    </script>
</body>
</html>
