<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile - FitGauge</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface-hover: #1a1a1a;
            --border: #262626;
            --text: #f5f5f5;
            --text-secondary: #737373;
            --accent: #22c55e;
            --font: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        .desc { color: var(--text-secondary); margin-bottom: 24px; font-size: 0.9rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group:last-child { margin-bottom: 0; }
        .form-label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        .form-input { width: 100%; padding: 12px 14px; background: var(--surface-hover); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font); font-size: 1rem; }
        .form-input:focus { outline: none; border-color: var(--accent); }
        .toggle-group { display: flex; gap: 8px; }
        .toggle-btn { flex: 1; padding: 12px; background: var(--surface-hover); border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary); font-family: var(--font); cursor: pointer; transition: all 0.2s; }
        .toggle-btn:hover { background: var(--border); }
        .toggle-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 500; }
        .unit-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
        .unit-btn { padding: 6px 12px; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text-secondary); font-size: 0.8rem; cursor: pointer; }
        .unit-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }
        .btn { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 8px; color: #000; font-family: var(--font); font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .btn:hover { background: #4ade80; }
        .btn-secondary { background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 0.9rem; text-decoration: none; margin-bottom: 24px; }
        .back-link:hover { color: var(--accent); }
        .success { background: rgba(34, 197, 94, 0.15); border: 1px solid var(--accent); border-radius: 8px; padding: 12px; color: var(--accent); margin-bottom: 16px; display: none; }
        .saved-data { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
        .saved-title { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
        .data-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .data-row:last-child { border-bottom: none; }
        .data-label { color: var(--text-secondary); }
        .data-value { color: var(--text); font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to calculators</a>
        
        <h1>Your Profile</h1>
        <p class="desc">Save your details once - they'll auto-fill on all calculators.</p>
        
        <div class="success" id="success">✓ Profile saved!</div>
        
        <div class="card">
            <div class="form-group">
                <label class="form-label">Gender</label>
                <div class="toggle-group">
                    <button class="toggle-btn" id="male-btn">Male</button>
                    <button class="toggle-btn" id="female-btn">Female</button>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Age</label>
                <input type="number" class="form-input" id="age" placeholder="Years">
            </div>
            
            <div class="form-group">
                <label class="form-label">Height</label>
                <div class="unit-toggle">
                    <button class="unit-btn active" id="height-cm-btn">cm</button>
                    <button class="unit-btn" id="height-ft-btn">ft</button>
                </div>
                <input type="number" class="form-input" id="height" placeholder="175">
            </div>
            
            <div class="form-group">
                <label class="form-label">Weight</label>
                <div class="unit-toggle">
                    <button class="unit-btn active" id="weight-kg-btn">kg</button>
                    <button class="unit-btn" id="weight-lbs-btn">lbs</button>
                </div>
                <input type="number" class="form-input" id="weight" placeholder="70">
            </div>
            
            <button class="btn" onclick="saveProfile()">Save Profile</button>
            <button class="btn btn-secondary" onclick="clearProfile()" style="margin-top: 10px;">Clear Profile</button>
        </div>
        
        <div class="saved-data" id="saved-data" style="display:none">
            <div class="saved-title">Saved Profile</div>
            <div id="data-display"></div>
        </div>
    </div>
    
    <script>
        var gender = localStorage.getItem('fitgauge_gender') || 'male';
        var age = localStorage.getItem('fitgauge_age') || '';
        var height = localStorage.getItem('fitgauge_height') || '';
        var heightUnit = localStorage.getItem('fitgauge_height_unit') || 'cm';
        var weight = localStorage.getItem('fitgauge_weight') || '';
        var weightUnit = localStorage.getItem('fitgauge_weight_unit') || 'kg';
        
        // Set initial values
        if (gender === 'male') {
            document.getElementById('male-btn').classList.add('active');
        } else {
            document.getElementById('female-btn').classList.add('active');
        }
        document.getElementById('age').value = age;
        document.getElementById('height').value = height;
        document.getElementById('weight').value = weight;
        
        if (heightUnit === 'ft') {
            document.getElementById('height-ft-btn').classList.add('active');
            document.getElementById('height-cm-btn').classList.remove('active');
        }
        if (weightUnit === 'lbs') {
            document.getElementById('weight-lbs-btn').classList.add('active');
            document.getElementById('weight-kg-btn').classList.remove('active');
        }
        
        showSavedData();
        
        // Toggle handlers
        document.getElementById('male-btn').onclick = function() {
            gender = 'male';
            this.classList.add('active');
            document.getElementById('female-btn').classList.remove('active');
        };
        document.getElementById('female-btn').onclick = function() {
            gender = 'female';
            this.classList.add('active');
            document.getElementById('male-btn').classList.remove('active');
        };
        document.getElementById('height-cm-btn').onclick = function() {
            heightUnit = 'cm';
            this.classList.add('active');
            document.getElementById('height-ft-btn').classList.remove('active');
        };
        document.getElementById('height-ft-btn').onclick = function() {
            heightUnit = 'ft';
            this.classList.add('active');
            document.getElementById('height-cm-btn').classList.remove('active');
        };
        document.getElementById('weight-kg-btn').onclick = function() {
            weightUnit = 'kg';
            this.classList.add('active');
            document.getElementById('weight-lbs-btn').classList.remove('active');
        };
        document.getElementById('weight-lbs-btn').onclick = function() {
            weightUnit = 'lbs';
            this.classList.add('active');
            document.getElementById('weight-kg-btn').classList.remove('active');
        };
        
        function saveProfile() {
            localStorage.setItem('fitgauge_gender', gender);
            localStorage.setItem('fitgauge_age', document.getElementById('age').value);
            localStorage.setItem('fitgauge_height', document.getElementById('height').value);
            localStorage.setItem('fitgauge_height_unit', heightUnit);
            localStorage.setItem('fitgauge_weight', document.getElementById('weight').value);
            localStorage.setItem('fitgauge_weight_unit', weightUnit);
            
            var success = document.getElementById('success');
            success.style.display = 'block';
            setTimeout(function() { success.style.display = 'none'; }, 2000);
            
            showSavedData();
        }
        
        function clearProfile() {
            localStorage.removeItem('fitgauge_gender');
            localStorage.removeItem('fitgauge_age');
            localStorage.removeItem('fitgauge_height');
            localStorage.removeItem('fitgauge_height_unit');
            localStorage.removeItem('fitgauge_weight');
            localStorage.removeItem('fitgauge_weight_unit');
            
            document.getElementById('age').value = '';
            document.getElementById('height').value = '';
            document.getElementById('weight').value = '';
            document.getElementById('saved-data').style.display = 'none';
        }
        
        function showSavedData() {
            var data = document.getElementById('data-display');
            var savedAge = localStorage.getItem('fitgauge_age');
            var savedHeight = localStorage.getItem('fitgauge_height');
            var savedWeight = localStorage.getItem('fitgauge_weight');
            
            if (savedAge || savedHeight || savedWeight) {
                var html = '';
                if (gender) html += '<div class="data-row"><span class="data-label">Gender</span><span class="data-value">' + gender + '</span></div>';
                if (savedAge) html += '<div class="data-row"><span class="data-label">Age</span><span class="data-value">' + savedAge + ' years</span></div>';
                if (savedHeight) html += '<div class="data-row"><span class="data-label">Height</span><span class="data-value">' + savedHeight + ' ' + heightUnit + '</span></div>';
                if (savedWeight) html += '<div class="data-row"><span class="data-label">Weight</span><span class="data-value">' + savedWeight + ' ' + weightUnit + '</span></div>';
                data.innerHTML = html;
                document.getElementById('saved-data').style.display = 'block';
            }
        }
    </script>
</body>
</html>
